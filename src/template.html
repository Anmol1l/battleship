<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>
    <header>
        <h1>Battleships</h1>
    </header>
    <main>
        <section class="player">
            <div class="board1"></div>
            <div class="buttons-ship1">
                <div class="buttons">
                    <button class="randomise" data-player="1">Randomise</button>
                    <button class="reset">Reset</button>
                    <button class="confirm">Confirm</button>
                    <button class="rotate" data-player="1">Rotate</button>
                </div>
                <div class="unplaced-ships"></div>
            </div>
        </section>
        <section class="player">
            <div class="board2"></div>
            <div class="buttons-ship2">
                <div class="buttons">
                    <button class="randomise" data-player="2">Randomise</button>
                    <button class="reset">Reset</button>
                    <button class="confirm">Confirm</button>
                    <button class="rotate" data-player="2">Rotate</button>
                </div>
                <div class="unplaced-ships"></div>
            </div>
        </section>
    </main>
</body>
</html>
